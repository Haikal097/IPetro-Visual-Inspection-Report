<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPETRO Photo Editor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ipetro: {
                red: '#CD202C',
                grey: '#77787B',
                light: '#F4F4F4',
                darkgrey: '#545454'
              }
            }
          }
        }
      }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        body { background-color: #F4F4F4; overflow: hidden; }
        html, body { height: 100%; margin: 0; overscroll-behavior-x: none; }
        /* Range input styling */
        input[type=range] {
            height: 4px;
            border-radius: 2px;
            background: #e5e7eb;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #CD202C;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="root" style="height: 100%;"></div>

<script type="text/babel">
    const { useEffect, useMemo, useRef, useState, useCallback } = React;

    const uid = () => Math.random().toString(36).slice(2, 10);

    function PhotoEditor() {
      const [imageSrc, setImageSrc] = useState(null);
      const [imgNatural, setImgNatural] = useState(null);
      const [highlights, setHighlights] = useState([]);
      const [activeId, setActiveId] = useState(null);
      
      const [previewZoomLevel, setPreviewZoomLevel] = useState(1); 
      const [stageZoom, setStageZoom] = useState(1); 
      const [cursorStyle, setCursorStyle] = useState("grab");
      const [, forceUpdate] = useState(0); 

      const panRef = useRef({ x: 0, y: 0 }); 
      const transformRef = useRef(null); 
      
      const dragRef = useRef({ 
        startX: 0, startY: 0, 
        initialPanX: 0, initialPanY: 0, 
        isDragging: false 
      });

      const drawingRef = useRef({ 
        startX: 0, startY: 0, currentX: 0, currentY: 0, drawing: false 
      });

      const imgRef = useRef(null);
      const stageRef = useRef(null);
      const zoomCanvasRef = useRef(null);

      // Helper to get the currently active highlight object
      const activeHighlight = useMemo(() => highlights.find(h => h.id === activeId), [highlights, activeId]);

      const onPickImage = (file) => {
        const reader = new FileReader();
        reader.onload = () => setImageSrc(reader.result);
        reader.readAsDataURL(file);
      };

      const onImageLoad = (e) => {
        const el = e.currentTarget;
        const natW = el.naturalWidth;
        const natH = el.naturalHeight;
        setImgNatural({ w: natW, h: natH });
        
        if (stageRef.current) {
            const containerW = stageRef.current.clientWidth;
            const fitScale = containerW / natW;
            setStageZoom(fitScale > 0 ? fitScale : 1);
        }

        setPreviewZoomLevel(1);
        panRef.current = { x: 0, y: 0 };
        updateMainTransform();
      };

      const updateMainTransform = () => {
          if (transformRef.current) {
               transformRef.current.style.transform = `translate(${panRef.current.x}px, ${panRef.current.y}px) scale(${stageZoom})`;
          }
      };

      useEffect(() => {
          updateMainTransform();
      }, [stageZoom]);

      // --- POINTER EVENTS (Main Stage) ---

      const onPointerDown = (e) => {
        if (!stageRef.current) return;
        // Don't prevent default if clicking on a scrollbar in the sidebar
        if (e.target.closest('.overflow-y-auto')) return;

        e.preventDefault(); 
        e.currentTarget.setPointerCapture(e.pointerId);

        const rect = stageRef.current.getBoundingClientRect();
        
        // CHECK MOUSE BUTTON
        if (e.button === 2) { 
            // === RIGHT CLICK -> DRAW ===
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const drawX = (mouseX - panRef.current.x) / stageZoom;
            const drawY = (mouseY - panRef.current.y) / stageZoom;
            
            drawingRef.current = { startX: drawX, startY: drawY, currentX: drawX, currentY: drawY, drawing: true };
            setCursorStyle("crosshair"); 
        } 
        else if (e.button === 0) {
            // === LEFT CLICK -> PAN ===
            // Only pan if not clicking on a highlight box (which is handled by its own event)
            if(e.target === stageRef.current || e.target.tagName === 'IMG') {
                 setCursorStyle("grabbing");
                 dragRef.current.isDragging = true;
                 dragRef.current.startX = e.clientX;
                 dragRef.current.startY = e.clientY;
                 dragRef.current.initialPanX = panRef.current.x;
                 dragRef.current.initialPanY = panRef.current.y;
            }
        }
      };

      const onPointerMove = (e) => {
        if (!stageRef.current) return;

        if (drawingRef.current.drawing) {
            // DRAWING LOGIC
            const rect = stageRef.current.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            drawingRef.current.currentX = (mouseX - panRef.current.x) / stageZoom;
            drawingRef.current.currentY = (mouseY - panRef.current.y) / stageZoom;
            
            forceUpdate(n => n + 1); 
        } 
        else if (dragRef.current.isDragging) {
            // PANNING LOGIC
            const dx = e.clientX - dragRef.current.startX;
            const dy = e.clientY - dragRef.current.startY;
            panRef.current.x = dragRef.current.initialPanX + dx;
            panRef.current.y = dragRef.current.initialPanY + dy;
            updateMainTransform();
        }
      };

      const onPointerUp = (e) => {
        e.currentTarget.releasePointerCapture(e.pointerId);

        // FINISH DRAWING
        if (drawingRef.current.drawing) {
            if (imgNatural) {
                const { startX, startY, currentX, currentY } = drawingRef.current;
                
                const xImg = Math.min(startX, currentX);
                const yImg = Math.min(startY, currentY);
                const wImg = Math.abs(currentX - startX);
                const hImg = Math.abs(currentY - startY);

                if (wImg > 5 && hImg > 5) {
                    const x1 = clamp(xImg, 0, imgNatural.w);
                    const y1 = clamp(yImg, 0, imgNatural.h);
                    const x2 = clamp(xImg + wImg, 0, imgNatural.w);
                    const y2 = clamp(yImg + hImg, 0, imgNatural.h);

                    const newRect = {
                        x: Math.min(x1, x2),
                        y: Math.min(y1, y2),
                        w: Math.abs(x2 - x1),
                        h: Math.abs(y2 - y1),
                    };

                    if (newRect.w > 1 && newRect.h > 1) {
                        const defaultName = `Highlight ${highlights.length + 1}`;
                        // NEW: Initialize filters for the new highlight
                        const newHl = { 
                            id: uid(), 
                            rect: newRect, 
                            comment: "", 
                            name: defaultName, 
                            color: pickColor(),
                            filters: { brightness: 100, contrast: 100, invert: false, grayscale: 0 }
                        };
                        setHighlights((arr) => [...arr, newHl]);
                        setActiveId(newHl.id);
                    }
                }
            }
            drawingRef.current.drawing = false;
            setCursorStyle("grab");
            forceUpdate(n => n + 1);
        } 
        // FINISH PANNING
        else if (dragRef.current.isDragging) {
            dragRef.current.isDragging = false;
            setCursorStyle("grab");
        }
      };

      const onContextMenu = (e) => {
          e.preventDefault();
          return false;
      };

      const handleStageWheel = (e) => {
        e.preventDefault();
        if (!stageRef.current || !imageSrc) return;
        
        const rect = stageRef.current.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const oldZoom = stageZoom;
        const oldPanX = panRef.current.x;
        const oldPanY = panRef.current.y;
        
        const dir = Math.sign(e.deltaY) * -1;
        const factor = 1.1;
        let newZoom = oldZoom * (dir > 0 ? factor : 1 / factor);
        
        newZoom = clamp(newZoom, 0.05, 20); 

        const newPanX = mouseX - (mouseX - oldPanX) * (newZoom / oldZoom);
        const newPanY = mouseY - (mouseY - oldPanY) * (newZoom / oldZoom);
        
        panRef.current.x = newPanX;
        panRef.current.y = newPanY;
        setStageZoom(newZoom);
      };

      // --- RENDER PREVIEW WITH FILTERS ---
      const renderPreviewZoom = () => {
        const ctx = zoomCanvasRef.current && zoomCanvasRef.current.getContext("2d");
        if (!ctx || !imgRef.current || !imgNatural) return;
        const img = imgRef.current;
        const canvas = zoomCanvasRef.current;
        
        // Use activeHighlight memo
        const target = activeHighlight;

        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (!target) {
             // Reset filter if no target
             ctx.filter = 'none';
             return;
        }

        const { x, y, w, h } = target.rect;
        // Apply Filters to context BEFORE drawing image
        const f = target.filters;
        ctx.filter = `brightness(${f.brightness}%) contrast(${f.contrast}%) invert(${f.invert ? 100 : 0}%) grayscale(${f.grayscale}%)`;

        const sx = canvas.width / w;
        const sy = canvas.height / h;
        const s = Math.min(sx, sy) * previewZoomLevel;
        const drawW = w * s;
        const drawH = h * s;
        const dx = (canvas.width - drawW) / 2;
        const dy = (canvas.height - drawH) / 2;
        
        ctx.imageSmoothingEnabled = false;
        // Draw the filtered image crop
        ctx.drawImage(img, x, y, w, h, dx, dy, drawW, drawH);
        
        // Reset filter for border drawing
        ctx.filter = 'none';
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#CD202C"; 
        ctx.strokeRect(dx, dy, drawW, drawH);
      };

      // Add activeHighlight to dependency array so it updates when sliders move
      useEffect(() => { renderPreviewZoom(); }, [activeId, previewZoomLevel, highlights, imageSrc, activeHighlight]);

      const deleteHighlight = (id) => {
        setHighlights((arr) => arr.filter((h) => h.id !== id));
        if (activeId === id) setActiveId(null);
      };

      // --- SAVE FUNCTION WITH FILTERS ---
      const saveImage = () => {
        if (!imgNatural || !imageSrc) return;

        const mimeType = "image/png";
        const ext = "png";

        const canvas = document.createElement("canvas");
        canvas.width = imgNatural.w;
        canvas.height = imgNatural.h;
        const ctx = canvas.getContext("2d");

        const img = new Image();
        img.crossOrigin = "anonymous"; 
        img.src = imageSrc;
        
        img.onload = () => {
            try {
                // 1. Draw base image
                ctx.drawImage(img, 0, 0);

                // 2. Apply filters and draw highlights
                highlights.forEach(h => {
                    // --- Apply Filter to the Region ---
                    ctx.save(); // Save current state
                    const f = h.filters;
                    // Set filter on context
                    ctx.filter = `brightness(${f.brightness}%) contrast(${f.contrast}%) invert(${f.invert ? 100 : 0}%) grayscale(${f.grayscale}%)`;
                    // Redraw only the highlighted region over itself with the filter applied
                    ctx.drawImage(img, h.rect.x, h.rect.y, h.rect.w, h.rect.h, h.rect.x, h.rect.y, h.rect.w, h.rect.h);
                    ctx.restore(); // Restore state (removes filter for next steps)

                    // --- Draw UI Elements (Border/Text) ---
                    const lineWidth = Math.max(3, imgNatural.w / 400);
                    ctx.lineWidth = lineWidth;
                    ctx.strokeStyle = h.color;
                    ctx.strokeRect(h.rect.x, h.rect.y, h.rect.w, h.rect.h);

                    const fontSize = Math.max(14, imgNatural.w / 80); 
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    const text = h.name;
                    const metrics = ctx.measureText(text);
                    const padding = fontSize / 2;
                    const bgWidth = metrics.width + padding * 2;
                    const bgHeight = fontSize + padding;
                    
                    const lx = h.rect.x;
                    const ly = h.rect.y - bgHeight;

                    ctx.fillStyle = h.color;
                    ctx.fillRect(lx, ly, bgWidth, bgHeight);

                    ctx.fillStyle = "#ffffff";
                    ctx.textBaseline = "top";
                    ctx.fillText(text, lx + padding, ly + padding/2);
                });

                const link = document.createElement("a");
                link.download = `ipetro-edited.${ext}`;
                link.href = canvas.toDataURL(mimeType);
                link.click();
            } catch (e) {
                alert("Error saving image: " + e.message + ". If using the Demo Image, this may be a browser security restriction.");
            }
        };
        
        img.onerror = () => {
            alert("Failed to load image for saving.");
        };
      };

      const updateComment = (id, text) =>
        setHighlights((arr) => arr.map((h) => (h.id === id ? { ...h, comment: text } : h)));
      
      const updateName = (id, text) =>
        setHighlights((arr) => arr.map((h) => (h.id === id ? { ...h, name: text } : h)));

      // --- NEW: Update Filter State ---
      const updateFilter = (id, key, value) => {
          setHighlights(arr => arr.map(h => {
              if (h.id === id) {
                  return { ...h, filters: { ...h.filters, [key]: value } };
              }
              return h;
          }));
      };


      return (
        <div className="h-screen w-full bg-ipetro-light text-ipetro-grey font-sans flex flex-col overflow-hidden">
          {/* Header */}
          <header className="sticky top-0 z-20 flex items-center justify-between gap-3 border-b border-gray-200 bg-white/90 px-4 py-3 backdrop-blur shrink-0 shadow-sm h-16">
            <div className="flex items-center gap-6">
                <img src="image_0.png" alt="iPETRO Logo" className="h-10 w-auto" />
                <div className="flex items-center gap-1 bg-gray-100 rounded-lg border border-gray-200 p-1">
                    <button className="px-2 py-1 hover:bg-gray-200 rounded text-ipetro-grey" onClick={() => setStageZoom(z => clamp(z * 0.9, 0.05, 20))} title="Zoom Out">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                    </button>
                    <span className="text-xs font-mono w-10 text-center font-medium">{Math.round(stageZoom * 100)}%</span>
                    <button className="px-2 py-1 hover:bg-gray-200 rounded text-ipetro-grey" onClick={() => setStageZoom(z => clamp(z * 1.1, 0.05, 20))} title="Zoom In">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                    </button>
                </div>
            </div>

            <div className="flex items-center gap-2">
              <label className="cursor-pointer rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium hover:bg-gray-50 transition flex gap-1 items-center text-ipetro-grey shadow-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <input type="file" accept="image/*" className="hidden" onChange={(e) => e.target.files?.[0] && onPickImage(e.target.files[0])} />
                <span className="hidden sm:inline">Upload</span>
              </label>

              <button onClick={saveImage} className="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium hover:bg-gray-50 transition flex gap-1 items-center text-ipetro-grey shadow-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span className="hidden sm:inline">Save Image</span>
              </button>

              <div className="h-6 w-px bg-gray-300 mx-1"></div>

              <button onClick={() => {setHighlights([]); setActiveId(null);}} className="rounded-lg border border-red-200 text-red-600 bg-red-50 px-3 py-1.5 text-xs font-medium hover:bg-red-100 transition shadow-sm" disabled={!highlights.length}>
                Clear
              </button>
            </div>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-12 flex-1 overflow-hidden">
            <div className="md:col-span-8 lg:col-span-9 relative bg-white overflow-hidden border-r border-gray-200">
                {!imageSrc ? (
                  <EmptyState onDemo={() => setImageSrc(PLACEHOLDER_IMG)} />
                ) : (
                  <div
                    ref={stageRef}
                    className="absolute inset-0 touch-none"
                    style={{ cursor: cursorStyle }}
                    onPointerDown={onPointerDown}
                    onPointerMove={onPointerMove}
                    onPointerUp={onPointerUp}
                    onWheel={handleStageWheel}
                    onContextMenu={onContextMenu} 
                  >
                    <div 
                      ref={transformRef}
                      style={{ transformOrigin: "0 0", willChange: "transform" }}
                    >
                      <img
                        ref={imgRef}
                        src={imageSrc}
                        onLoad={onImageLoad}
                        className="select-none max-w-none block drop-shadow-sm"
                        draggable={false}
                      />
                      <div className="absolute inset-0">
                        {highlights.map((h) => {
                          const { x, y, w, h: height } = h.rect;
                          const isActive = h.id === activeId;
                          return (
                            <React.Fragment key={h.id}>
                                {/* The Box */}
                                <div
                                  className="absolute"
                                  style={{
                                    left: x, top: y, width: w, height: height,
                                    border: isActive ? `3px solid ${h.color}` : `2px dashed ${h.color}`,
                                    background: isActive ? "rgba(255,255,255,0.2)" : "transparent",
                                    cursor: "pointer",
                                    pointerEvents: "auto", 
                                    boxShadow: isActive ? "0 0 0 1px rgba(255,255,255,0.5)" : "none",
                                    zIndex: isActive ? 20 : 10
                                  }}
                                  onPointerDown={(e) => { 
                                      if(e.button === 0) {
                                          e.stopPropagation(); 
                                          setActiveId(h.id); 
                                      }
                                  }}
                                />
                                {/* The Label */}
                                <div
                                    className="absolute pointer-events-none px-2 py-1 text[30px] font-bold text-white rounded-sm whitespace-nowrap shadow-sm"
                                    style={{
                                        left: x,
                                        top: y,
                                        transform: 'translateY(-100%) translateY(-4px)',
                                        backgroundColor: h.color,
                                        zIndex: isActive ? 30 : 15,
                                    }}
                                >
                                    {h.name}
                                </div>
                            </React.Fragment>
                          );
                        })}
                        {drawingRef.current.drawing && (
                          <div
                            className="absolute border-2 border-ipetro-red bg-ipetro-red/20 z-50 pointer-events-none"
                            style={{
                              left: Math.min(drawingRef.current.startX, drawingRef.current.currentX),
                              top: Math.min(drawingRef.current.startY, drawingRef.current.currentY),
                              width: Math.abs(drawingRef.current.currentX - drawingRef.current.startX),
                              height: Math.abs(drawingRef.current.currentY - drawingRef.current.startY),
                            }}
                          />
                        )}
                      </div>
                    </div>
                  </div>
                )}
                {imageSrc && (
                   <div className="absolute bottom-4 left-4 bg-white/90 px-3 py-1 rounded-full text-[10px] text-ipetro-grey font-medium pointer-events-none backdrop-blur border border-gray-200 shadow-sm z-50">
                     <span className="font-bold text-ipetro-red">Right-Click Drag</span> to Highlight • <span className="font-bold text-ipetro-grey">Left-Click Drag</span> to Pan
                   </div>
                )}
            </div>

            <div className="md:col-span-4 lg:col-span-3 bg-white border-l border-gray-200 flex flex-col h-full overflow-hidden overflow-y-auto">
              <div className="shrink-0 p-3 border-b border-gray-200 bg-gray-50/50">
                 <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-ipetro-grey uppercase tracking-wider">Preview & Enhance</span>
                 </div>
                 <div className="h-40 w-full rounded-lg overflow-hidden bg-white border border-gray-200 relative shadow-sm">
                    <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#9ca3af_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    {!activeId && <div className="absolute inset-0 flex items-center justify-center text-xs text-gray-400 font-medium z-10">Select a highlight to enhance</div>}
                    <canvas ref={zoomCanvasRef} className="relative h-full w-full object-contain" />
                 </div>

                 {/* --- ENHANCEMENT CONTROLS --- */}
                 {activeHighlight && (
                    <div className="mt-3 space-y-3 p-2 bg-white rounded-lg border border-gray-200 shadow-sm">
                        <div className="space-y-1">
                            <div className="flex justify-between text-[10px] font-medium text-ipetro-grey"><span>Brightness</span><span>{activeHighlight.filters.brightness}%</span></div>
                            <input type="range" min="0" max="200" value={activeHighlight.filters.brightness} onChange={(e) => updateFilter(activeId, 'brightness', e.target.value)} className="w-full accent-ipetro-red" />
                        </div>
                         <div className="space-y-1">
                            <div className="flex justify-between text-[10px] font-medium text-ipetro-grey"><span>Contrast</span><span>{activeHighlight.filters.contrast}%</span></div>
                            <input type="range" min="0" max="200" value={activeHighlight.filters.contrast} onChange={(e) => updateFilter(activeId, 'contrast', e.target.value)} className="w-full" />
                        </div>
                         <div className="space-y-1">
                            <div className="flex justify-between text-[10px] font-medium text-ipetro-grey"><span>Grayscale</span><span>{activeHighlight.filters.grayscale}%</span></div>
                            <input type="range" min="0" max="100" value={activeHighlight.filters.grayscale} onChange={(e) => updateFilter(activeId, 'grayscale', e.target.value)} className="w-full" />
                        </div>
                        <div className="flex items-center justify-between pt-1">
                             <span className="text-[10px] font-medium text-ipetro-grey">Invert Colors</span>
                             <label className="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" checked={activeHighlight.filters.invert} onChange={(e) => updateFilter(activeId, 'invert', e.target.checked)} className="sr-only peer"/>
                                <div className="w-7 h-4 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-ipetro-red"></div>
                            </label>
                        </div>
                        <button onClick={() => updateFilter(activeId, 'filters', { brightness: 100, contrast: 100, invert: false, grayscale: 0 })} className="w-full text-[10px] text-ipetro-red hover:bg-red-50 py-1 rounded transition">Reset Filters</button>
                    </div>
                 )}

                 <div className="flex gap-1 mt-2">
                   <button className="flex-1 py-1 rounded bg-white border border-gray-300 text-xs font-medium text-ipetro-grey hover:bg-gray-50 shadow-sm" onClick={()=>setPreviewZoomLevel(z=>Math.max(0.1, z*0.9))}>Zoom Out</button>
                   <button className="flex-1 py-1 rounded bg-white border border-gray-300 text-xs font-medium text-ipetro-grey hover:bg-gray-50 shadow-sm" onClick={()=>setPreviewZoomLevel(z=>Math.min(10, z*1.1))}>Zoom In</button>
                 </div>
              </div>

              <div className="flex-1 flex flex-col overflow-hidden bg-gray-50/50 min-h-0">
                <div className="px-3 py-2 border-b border-gray-200 text-xs font-bold text-ipetro-grey uppercase tracking-wider flex justify-between items-center">
                   <span>Annotations ({highlights.length})</span>
                   <button onClick={()=>{setHighlights([]); setActiveId(null);}} disabled={!highlights.length} className="text-[10px] text-red-500 hover:text-red-700 disabled:opacity-50 font-medium">Clear All</button>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-2">
                  {!highlights.length && (
                      <div className="flex flex-col items-center justify-center h-20 text-gray-400 text-xs text-center border-2 border-dashed border-gray-300 rounded-lg font-medium">
                        <span>No highlights yet</span>
                      </div>
                  )}
                  {highlights.map((h, i) => (
                    <div key={h.id} 
                         className={`group rounded-lg border p-2 transition-all shadow-sm ${h.id === activeId ? "border-ipetro-red/50 bg-ipetro-red/5 shadow-[0_0_10px_-3px_rgba(205,32,44,0.2)]" : "border-gray-200 bg-white hover:border-gray-300"}`}
                         onClick={() => setActiveId(h.id)}>
                      <div className="flex justify-between items-center mb-1.5">
                        <div className="flex items-center gap-2 flex-1">
                            <span className="w-2.5 h-2.5 rounded-full border border-black/10 shrink-0" style={{background: h.color}}></span>
                            <input 
                              type="text" 
                              className={`text-xs font-bold bg-transparent w-full outline-none border-b border-transparent hover:border-ipetro-red focus:border-ipetro-red transition-colors cursor-text ${h.id === activeId ? 'text-ipetro-red' : 'text-ipetro-grey'}`}
                              value={h.name}
                              onChange={(e) => updateName(h.id, e.target.value)}
                              onClick={(e) => e.stopPropagation()} 
                              title="Click to rename"
                            />
                        </div>
                        <button className="opacity-0 group-hover:opacity-100 text-[10px] text-red-400 hover:text-red-600 transition-opacity font-medium ml-2" onClick={(e)=>{ e.stopPropagation(); deleteHighlight(h.id); }}>Delete</button>
                      </div>
                      <textarea 
                        className={`w-full border rounded px-2 py-1.5 text-xs resize-none outline-none transition-colors font-medium ${h.id === activeId ? "bg-white border-ipetro-red/30 text-ipetro-darkgrey focus:border-ipetro-red" : "bg-gray-50 border-gray-200 text-ipetro-grey focus:bg-white focus:border-gray-400"}`}
                        rows={2}
                        placeholder="Add a note..."
                        value={h.comment}
                        onChange={(e) => updateComment(h.id, e.target.value)}
                      />
                       {/* Small indicator if filters are active */}
                      {(h.filters.brightness !== 100 || h.filters.contrast !== 100 || h.filters.invert || h.filters.grayscale > 0) && (
                          <div className="mt-1 text-[10px] text-ipetro-grey flex gap-1 items-center">
                              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" className="w-3 h-3"><path fillRule="evenodd" d="M8 1a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-1.5 0V1.75A.75.75 0 0 1 8 1ZM6.19 2.806a.75.75 0 1 1 1.06 1.06L5.312 5.81l1.941 1.941a.75.75 0 1 1-1.061 1.061l-2.47-2.472a.75.75 0 0 1 0-1.06l2.47-2.472ZM9.81 2.806a.75.75 0 0 0-1.06 1.06L10.688 5.81l-1.941 1.941a.75.75 0 1 0 1.061 1.061l2.47-2.472a.75.75 0 0 0 0-1.06l-2.47-2.472Z" clipRule="evenodd" /></svg>
                              Filters applied
                          </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
    function pickColor() {
      const palette = ["#FF2D00", "#00FF00", "#00E5FF", "#FFD700", "#FF00FF", "#3D5AFE"];
      return palette[Math.floor(Math.random() * palette.length)];
    }
    function EmptyState({ onDemo }) {
      return (
        <div className="absolute inset-0 flex flex-col items-center justify-center gap-4 text-center">
          <div className="p-6 rounded-full bg-gray-100 border border-gray-200 shadow-sm">
             <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" className="text-ipetro-grey">
               <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
             </svg>
          </div>
          <div className="text-ipetro-grey text-sm max-w-xs font-medium">
            <p className="mb-4">Upload a high-res image to start annotation.</p>
            <button onClick={onDemo} className="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm text-ipetro-grey hover:bg-gray-50 hover:text-ipetro-darkgrey transition w-full shadow-sm font-bold">
                Use Demo Image
            </button>
          </div>
        </div>
      );
    }

    const PLACEHOLDER_IMG = "https://images.unsplash.com/photo-1520333789090-1afc82db536a?q=80&w=2500&auto=format&fit=crop";

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PhotoEditor />);
</script>

</body>
</html>
